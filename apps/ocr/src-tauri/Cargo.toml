[package]
name = "rocktier-ocr"
version = "1.0.1"
edition = "2021"
description = "Rocktier OCR - make scanned PDFs searchable"

[lib]
name = "rocktier_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
ocr-engine = { path = "../engine" }
# 识别前置处理三件套（拉直 / 去摩尔纹 / 增强）：纯位图运算，不依赖推理运行时。
ocr-preprocess = { path = "../preprocess" }
write-searchable = { path = "../writer" }
pdfium-render = "0.9.4"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tempfile = "3"
# 识别结果 → .docx（与 Write 同版本，家族已有落盘与原子替换写法）
docx-rs = "0.4"
# 授权回执的解析与 Ed25519 离线验签（license.rs，FAMILY-LICENSE.md §2）
base64 = "0.22"
ed25519-dalek = "2"

[profile.release]
opt-level = 2
