name: Checksums

# 官网下载页的 SHA-256 墙必须与按钮指向的 release 同版本（2026-10-31 评审：
# 静态文件曾停在 PDF 1.1.0 / OCR 0.2.11，而 latest 已是 1.1.1 / 0.2.12，
# 照页面校验必然失败）。这里让 GitHub 自己刷新 checksums.json：
#   · 每小时兜底一次（2026-11-13 从「每 6 小时」收紧）；
#   · 产品仓可在发布后调用 repository_dispatch(event_type=release) 立即触发；
#   · workflow_dispatch 供手动补跑。
# 脚本只用 Node stdlib，不装依赖。
#
# 为什么收紧到每小时：家族发版有两条路径 —— 走 scripts/release-unattended.sh
# 的会被第 244 行强制校验 checksums 已等于本次 tag，手动 git tag 的不会。
# 2026-11-13 的 MD 1.0.23 / Write 1.4.16 两次都是手动路径，墙停在 11-05，
# 落后三个版本。闸门只在一条路上 = 另一条路上没有闸门，所以兜底必须更密。
#
# 仍然没有实现的那一半：产品仓目前没有任何一处调用 repository_dispatch，
# 也就是说「发布后立即刷新」这句注释到今天为止是空头承诺（见台账 D-150）。

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency:
  group: checksums
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 判据自检（判据自己先得是活的）
        run: node tools/verify-checksums.mjs --selftest
      - name: Regenerate checksums.json
        run: node tools/gen-checksums.mjs
      - name: 生成结果对账（对不上就不许提交坏文件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/verify-checksums.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- checksums.json; then
            echo "checksums.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checksums.json
          git commit -m "chore(checksums): sync with latest releases"
          git push
