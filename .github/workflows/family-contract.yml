# Rocktier 家族契约闸门 —— monorepo 唯一执行点
#
# 为什么执行点在这里（2026-11-24 定案）：
#   原来是私有台账仓 rocktier-docs 的 family-contract.yml：先 clone 8 个产品仓平铺到
#   family/，再跑 5 道闸门。monorepo 合并后那 8 个仓全部删除，这条链路两处同时失效：
#
#     ① clone 全部 404（布局没了）；
#     ② 更早一步就挂了 —— 私有仓 Actions 额度耗尽，job 从未启动
#        （annotation：「recent account payments have failed or your spending limit
#        needs to be increased」）。11-22 起每次 cron 都是红，而红的是账单，不是判据。
#
#   于是「闸门全绿」这件事长期无人验证。现在判据、契约、产品在同一个公开仓，
#   ubuntu 分钟数不计量，没有理由再放在私有仓。
#
# 契约唯一副本：docs/rocktier/（原在台账仓 docs/rocktier/）。旧设计的「9 份副本漂移」
# 前提随 8 仓合一自动消失 —— 一个仓只能有一份。
#
# 判据本身一行没改：22 条闸门仍按 `Rocktier PDF` 这类旧目录名找产品，
# scripts/family-gate.mjs 用符号链接农场把 apps/<id> 映射成旧名，布局对新判据透明。

name: Family contract

on:
  push:
    paths:
      - "docs/rocktier/**"
      - "apps/**"
      - "scripts/family-gate.mjs"
      - ".github/workflows/family-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 八道闸门依次跑，第一道红就停：
      #   family         22 条判据（tokens 字节一致 / i18n 键对账 / 菜单可达 / Windows 陷阱…）
      #   token-revert   产品样式里重定义 L0 令牌（登记在案的覆盖只报 ℹ）
      #   contrast       对比度与浅色档屏蔽、字面色登记
      #   locale-parity  语言集合四边对账（注册表 = 字典 = 联合 = 生成器）
      #   macos-hig      窗口/图标/Info.plist/原生命令的静态合规
      #   dangling-import 悬空 import（扫 0 个文件直接判失败，不许空转绿）
      #   release-i18n   发版命名 + 语言数 + 默认 en
      #   menu-click     菜单项逐项有响应路径
      #   file-associations 文件关联 name 唯一 / 扩展名不抢 / tiff 必带 tif
      # 脚本自己建 .family-root 软链农场，跑完即删（见 .gitignore）。
      - name: Run family gate (9 checks)
        run: node scripts/family-gate.mjs

  # 渲染态布局判据（2026-11-25 接，D-185）：八道 family gate 都是纯文本静态分析，
  # 量不到 DOM 盒模型。ux-audit 用 headless Chromium 量溢出/重叠/命中区，补这一维。
  # 口径：本机字体 ≠ 真机 WKWebView/WebView2，CI 结果只作「同环境纵向回归」，
  # 不是真机终审（真机字体差异另见 task_plan 独立待办）。
  ux-audit:
    name: UX audit (rendered layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # ux-audit 用全局 WebSocket，Node 20 以下不稳定
      - name: Locate Chromium
        id: chrome
        run: |
          for c in google-chrome chromium chromium-browser google-chrome-stable; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "bin=$(command -v "$c")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no chromium found on runner" >&2
          exit 1
      - name: Build probe target (markdown)
        working-directory: apps/markdown
        run: |
          npm ci
          npm run build
      # 先跑脚本自带的正负对照：注入真溢出要报红、aria-hidden 隐藏层要豁免；
      # 判据本身失效时不能让它「全绿」蒙混过关。
      - name: Self-check (positive + negative)
        working-directory: apps/markdown
        run: |
          set -e
          cp dist/index.html /tmp/ux-audit-index.bak
          node ../../docs/rocktier/tools/ux-audit.mjs --root dist --steps 2 --browser "${{ steps.chrome.outputs.bin }}" --port 8931
          python3 - <<'PY'
          p = "dist/index.html"
          s = open(p, encoding="utf-8").read()
          inject = ('<div id="ux-neg" style="width:40px;overflow:hidden;white-space:nowrap">'
                    '<span>NEGATIVE_OVERFLOW_TEST_STRING_LONG_ENOUGH_TO_TRIGGER_CLIP</span></div>'
                    '<div aria-hidden="true" id="ux-hidden" style="width:40px;overflow:hidden;white-space:nowrap">'
                    '<span>HIDDEN_OVERFLOW_SHOULD_BE_IGNORED</span></div>')
          i = s.rfind("</body>")
          open(p, "w", encoding="utf-8").write(s[:i] + inject + s[i:])
          PY
          if node ../../docs/rocktier/tools/ux-audit.mjs --root dist --steps 2 --browser "${{ steps.chrome.outputs.bin }}" --port 8932; then
            echo "negative control did not fail — audit predicate is broken" >&2
            cp /tmp/ux-audit-index.bak dist/index.html
            exit 1
          fi
          cp /tmp/ux-audit-index.bak dist/index.html
      # 正式判据：只量上面已构建的 markdown dist。其余 7 款不预设 dist —— 在各自
      # Checks job 里 npm ci + build 之后再逐个纳入，避免用不存在的目录制造假红。
      # Ubuntu 字体与 mac/win 不同，先收集基线；稳定后去掉 continue-on-error 转硬判据。
      - name: Audit markdown (baseline)
        continue-on-error: true
        working-directory: apps/markdown
        run: |
          node ../../docs/rocktier/tools/ux-audit.mjs \
            --root dist --steps 12 --browser "${{ steps.chrome.outputs.bin }}" --port 8933
