name: Signing smoke test

# 只为验证「Developer ID 证书 + 公证凭据」这条链在 CI 上真的成立，不产出任何安装包、
# 不碰 release。手工触发：
#   gh workflow run signing-smoke.yml
# 判据：identity 必须被识别为 valid（说明 runner 自带 Developer ID 中间证书），
#      签名结果必须是 Developer ID Application + secure timestamp，
#      一个临时 .app 能真的过公证并 staple（这一步会向 Apple 提交，通常 1-3 分钟）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: macOS signing smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12:-}" ]; then
            echo "::error::APPLE_CERT_P12 未配置"; exit 1
          fi
          keychain="$RUNNER_TEMP/smoke.keychain-db"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Identity must be valid
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          n=$(security find-identity -v -p codesigning | grep -c "Developer ID Application" || true)
          if [ "$n" -lt 1 ]; then
            echo "::error::没有可用的 Developer ID Application 身份（多半是 runner 缺 G2 中间证书，或 p12 里没有私钥）"
            security find-certificate -a -c "Developer ID" -p | openssl x509 -noout -issuer -subject || true
            exit 1
          fi

      - name: Sign a throwaway binary
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning | awk '/Developer ID Application/ {print $2; exit}')
          cp /bin/echo "$RUNNER_TEMP/probe"
          codesign -s "$identity" --options runtime --timestamp -fv "$RUNNER_TEMP/probe"
          codesign -dvvv "$RUNNER_TEMP/probe" 2>&1 | tee "$RUNNER_TEMP/probe.txt"
          grep -q "Signature=Developer ID Application" "$RUNNER_TEMP/probe.txt"
          grep -q "Timestamp=" "$RUNNER_TEMP/probe.txt"

      - name: Notarize and staple a throwaway DMG
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning | awk '/Developer ID Application/ {print $2; exit}')
          root="$RUNNER_TEMP/smoke-app"
          app="$root/Rocktier Smoke.app"
          mkdir -p "$app/Contents/MacOS"
          cp /bin/echo "$app/Contents/MacOS/probe"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>probe</string>
            <key>CFBundleIdentifier</key><string>com.rocktier.signing-smoke</string>
            <key>CFBundleName</key><string>Rocktier Smoke</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST
          codesign -s "$identity" --options runtime --timestamp -fv "$app"
          dmg="$RUNNER_TEMP/smoke.dmg"
          hdiutil create -volname "Rocktier Smoke" -srcfolder "$root" -ov -format UDZO "$dmg" -quiet
          codesign -s "$identity" --timestamp -fv "$dmg"
          rc=0
          bash scripts/notarize-dmg.sh "$dmg" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::没有公证凭据，APPLE_API_* 与 APPLE_ID/APPLE_APP_PASSWORD 都缺"
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg" || true
