# Rocktier Journal — build & release
# macOS aarch64/x64 dmg + app.zip; Windows x64 MSI/NSIS + MSIX/MSIXBundle (Store).
# 触发：tag 推送（journal/v*）与手动。main push 不再自动打包 —— 叠加 checks.yml
# 会打爆账号的 5 个 macOS 并发槽位（2026-11-23 实测 aarch64 被取消）。
# main 的编译正确性由 checks.yml 负责；要出测试包用 workflow_dispatch。
name: Build & Release

on:
  push:
    tags: ["journal/v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journal-build-macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
            filearch: arm64
          - runner: macos-15-intel
            arch: x64
            filearch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/journal/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/journal/src-tauri -> target"
          key: ${{ matrix.arch }}

      - name: Install frontend deps
        working-directory: apps/journal
        run: npm install --no-audit --no-fund

      - name: Build DMG
        working-directory: apps/journal
        run: npm run tauri build

      # Journal 是八款里最后一个补签名的：此前 npm run tauri build 直接出 dmg 就发布，
      # 产物是 ARM64 链接器给的 ad-hoc 签名，下载副本一律被 Gatekeeper 拦。
      # 放在 Package app.zip 之前，是为了让 zip 里装的也是签过的那份 .app。
      #
      # 重打 DMG 是必须的：tauri 打包时 .app 还是 ad-hoc，签完得换回镜像里，
      # 再对镜像本身签一次，notarytool 提交的才是签名后的整包。
      - name: Sign the app bundle, notarize it, and repack the DMG
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # 公证凭据：API Key 不过期，优先；Apple ID + 专用密码只作回退（见 scripts/notarize-dmg.sh）
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          app=$(find "apps/journal/src-tauri/target/release/bundle/macos" \
            -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::.app not found"; exit 1; }
          dmg=$(find "apps/journal/src-tauri/target/release/bundle/dmg" \
            -name '*.dmg' -print -quit)
          [ -n "$dmg" ] || { echo "::error::.dmg not found"; exit 1; }

          sign_app=(-s -)
          if [ -n "${APPLE_CERT_P12:-}" ]; then
            keychain="$RUNNER_TEMP/rocktier-signing.keychain-db"
            echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$keychain"
            # 6 小时不锁：同一步里还要等 notarytool，15 分钟不活动锁会卡住 DMG 二次签名。
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" \
              | awk '/Developer ID Application/ {print $2; exit}')
            if [ -z "$identity" ]; then
              echo "::error::APPLE_CERT_P12 is set but contains no Developer ID Application identity."
              exit 1
            fi
            echo "signing as $identity"
            sign_app=(-s "$identity" --options runtime --timestamp --entitlements apps/journal/src-tauri/Entitlements.plist)
          else
            echo "::notice::No Developer ID certificate configured - ad-hoc signing. Downloaded copies will still be flagged by Gatekeeper."
          fi

          codesign "${sign_app[@]}" -fv --deep "$app"
          codesign --verify --deep --strict "$app"
          codesign -dvvv "$app" 2>&1 | grep 'Signature=' || true

          work=$(mktemp -d)
          hdiutil convert "$dmg" -format UDRW -o "$work/rw.dmg" -quiet
          mnt="$work/m"
          mkdir -p "$mnt"
          hdiutil attach "$work/rw.dmg" -readwrite -nobrowse -mountpoint "$mnt" -quiet
          rm -rf "$mnt/$(basename "$app")"
          cp -R "$app" "$mnt/"
          hdiutil detach "$mnt" -quiet
          hdiutil convert "$work/rw.dmg" -format UDZO -o "$work/signed.dmg" -quiet
          mv "$work/signed.dmg" "$dmg"
          rm -rf "$work"

          if [ -n "${APPLE_CERT_P12:-}" ]; then
            codesign -s "$identity" --timestamp -fv "$dmg"
            rc=0
            bash scripts/notarize-dmg.sh "$dmg" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi

            # 硬断言：dmg / .app 必须是 Developer ID 且带 secure timestamp。
            # 用 case 而不是 `| grep -q`：pipefail 下 grep 提前退出会让 codesign
            # 收 SIGPIPE(141)，把「断言通过」误判成失败。
            dmg_info=$(codesign -dv --verbose=4 "$dmg" 2>&1 || true)
            app_info=$(codesign -dv --verbose=4 "$app" 2>&1 || true)
            case "$dmg_info" in *"Authority=Developer ID Application"*) ;; *)
              echo "::error::DMG signature is missing Developer ID authority"; exit 1 ;; esac
            case "$dmg_info" in *"Timestamp="*) ;; *)
              echo "::error::DMG signature has no secure timestamp"; exit 1 ;; esac
            case "$app_info" in *"Authority=Developer ID Application"*) ;; *)
              echo "::error::.app signature is missing Developer ID authority"; exit 1 ;; esac
            case "$app_info" in *"Timestamp="*) ;; *)
              echo "::error::.app signature has no secure timestamp"; exit 1 ;; esac

            # Gatekeeper 兜底：dmg 是用户实际打开的载体，必须 accepted。
            spctl -a -t open --context context:primary-signature -vv "$dmg" \
              || { echo "::error::Gatekeeper rejected the notarized DMG"; exit 1; }
            # .app 没有独立票据，spctl 走在线查询；只作 warning，避免离线误红。
            spctl -a -vv "$app" \
              || echo "::warning::spctl did not accept the .app (no embedded ticket by design - verify online)"
          else
            codesign -s - -fv "$dmg"
            echo "::notice::ad-hoc build: signature assertions and spctl skipped (by design)."
          fi
          codesign -dvvv "$dmg" 2>&1 | grep 'Signature=' || true

      - name: Package app.zip
        run: |
          set -e
          APP=$(find apps/journal/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          file "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q '${{ matrix.filearch }}'
          ditto -c -k --keepParent "$APP" "Rocktier.Journal_${{ matrix.arch }}.app.zip"

      - name: Upload artifact (branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-macos-${{ matrix.arch }}
          path: |
            apps/journal/src-tauri/target/release/bundle/dmg/*.dmg
            Rocktier.Journal_${{ matrix.arch }}.app.zip
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/journal/src-tauri/target/release/bundle/dmg/*.dmg
            Rocktier.Journal_${{ matrix.arch }}.app.zip
          generate_release_notes: true

  journal-build-windows:
    name: Windows x64 (MSI + MSIX)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/journal/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/journal/src-tauri -> target"

      - name: Install frontend deps
        working-directory: apps/journal
        run: npm install --no-audit --no-fund

      - name: Build MSI + NSIS installers
        working-directory: apps/journal
        run: npm run tauri build

      # MSIX/MSIXBundle for Microsoft Store：tauri-windows-bundle 写盘到
      # apps/journal/src-tauri/target/msix/，不是 gen/windows/（那只是输入模板）。
      #
      # MSIX 直装走 direct 付费墙（微软商店渠道已弃用，2026-10-05 终裁 C3）。
      # 若未来恢复商店渠道：本步需加 env ROCKTIER_CHANNEL: store（10.8.2/10.8.4）。
      - name: Build MSIX
        working-directory: apps/journal
        run: npm run tauri:windows:build

      - name: Strip _en-US from MSI filename
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in apps/journal/src-tauri/target/release/bundle/msi/*_en-US.msi; do
            nf="${f%_en-US.msi}.msi"
            mv "$f" "$nf"
            echo "  $(basename "$f") -> $(basename "$nf")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no *_en-US.msi found - Tauri naming changed, this step needs updating"
            ls -1 apps/journal/src-tauri/target/release/bundle/msi/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload artifacts (branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Journal-windows-x64
          path: |
            apps/journal/src-tauri/target/release/bundle/msi/*.msi
            apps/journal/src-tauri/target/release/bundle/nsis/*.exe
            apps/journal/src-tauri/target/msix/*.msix*
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apps/journal/src-tauri/target/release/bundle/msi/*.msi
            apps/journal/src-tauri/target/release/bundle/nsis/*.exe
            apps/journal/src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  journal-publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [journal-build-macos, journal-build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '_aarch64\.dmg$ _x64\.dmg$ _aarch64\.app\.zip$ _x64\.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
# 这个 job **必须 checkout**，否则下面的 gh 命令无法工作。
      # 没有 actions/checkout 就没有 git remote，而 gh 靠 git remote 推断
      # 当前仓库 —— 于是每条 gh 命令报
      #   `failed to run git: fatal: not a git repository`
      # 并以非 0 退出。
      #
      # 本 job 只需要读/改 Release 状态、不需要源码，但**为了让 gh 认出
      # 仓库，仍必须 checkout**（build job 都有，只有这里漏了）。
      #
      # 实测踩过：MD v1.0.8 / CAD v0.2.6 / Journal v0.2.8 三仓发版全红，
      # 报错是「六个包全缺」，而资产其实早已上传完毕 —— 真因是这里缺
      # checkout，此前被校验段里的 `2>/dev/null || true` 掩盖着；
      # 去掉那个 `2>/dev/null` 之后它才浮出来。
      #
      # 另一条思路是给每条 gh 命令加 `--repo ${{ github.repository }}`。
      # 选 checkout 是因为它一次解决全部 gh 子命令（view/edit/upload），
      # 而 `--repo` 漏写一处就又坏。
      - uses: actions/checkout@v4
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            # 保留 || true 仅为让轮询能继续重试（资产 API 确实会 lag），
            # 但**必须把 stderr 打出来** —— 之前 `2>/dev/null` 把它一并丢掉，
            # 于是 gh 的真实错误（权限 / 仓库名 / Rate limit）被伪装成
            # 「资产还没上传」，报错信息完全指错方向，排查方向整个跑偏。
            # 实测踩过：MD v1.0.7 / CAD v0.2.5 / Journal v0.2.7 三个仓资产其实齐全，
            # 校验却报「六个包全缺」—— 就是这一行。修复沿用 Write 仓的写法。
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
